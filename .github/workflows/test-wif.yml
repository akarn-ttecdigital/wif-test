name: Test WIF Authentication

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/151472627439/locations/global/workloadIdentityPools/vitalant-test-github-pool/providers/github-oidc-provider
          service_account: test-github-actions-sa@insightsteamsandbox.iam.gserviceaccount.com

      - name: Verify authentication
        run: gcloud auth list
